[project]
name = "data-loom"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca-blue", email = "luca.samoyed.public@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
data-loom = "data_loom:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
